name: Build Android APK

# 在推送到 main/master 分支时自动打包，也可�?Actions 页面手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    # GitHub 免费 Linux 运行器（自带 JDK，Android SDK 在下方安装）
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代�?        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装前端依赖
        run: pnpm install

      - name: 构建网页（生�?dist/�?        run: pnpm build

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装构建组�?        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 同步网页资源到安卓工�?        run: npx cap sync android

      - name: 编译 Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ciyuan-storage-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
