name: Build Android APK

# 在推送到 main/master 分支时自动打包，也可在 Actions 页面手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    # GitHub 免费 Linux 运行器（自带 JDK，Android SDK 在下方安装）
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm install --legacy-peer-deps

      - name: 构建网页（生成 dist/）
        run: npm run build

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK（含构建组件）
        uses: android-actions/setup-android@v3
        with:
          # 注意：默认会安装已弃用的 'tools' 包导致失败，这里明确指定需要的组件（不含 tools）
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 同步网页资源到安卓工程
        run: npx cap sync android

      - name: 编译 Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ciyuan-storage-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
