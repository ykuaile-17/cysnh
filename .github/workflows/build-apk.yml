name: Build Android APK

# 在推送到 main/master 分支时自动打包，也可在 Actions 页面手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    # GitHub 免费 Linux 运行器（自带 JDK，Android SDK 在下方安装）
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm install --legacy-peer-deps

      - name: 构建网页（生成 dist/）
        run: npm run build

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装构建组件并接受许可
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -e
          ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          # 自动找到 setup-android 实际安装的 cmdline-tools 路径（latest 或带版本号）
          SM=$(ls "$ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
          if [ -z "$SM" ]; then
            echo "未找到 sdkmanager，诊断 SDK 目录："
            ls -la "$ROOT" || true
            ls -la "$ROOT/cmdline-tools" || true
            exit 1
          fi
          echo "使用 sdkmanager: $SM"
          yes | "$SM" --sdk_root="$ROOT" --licenses
          "$SM" --sdk_root="$ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 同步网页资源到安卓工程
        run: npx cap sync android

      - name: 编译 Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ciyuan-storage-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
